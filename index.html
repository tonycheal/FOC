<html>
<head>
    <title>FOC - Apollonius</title>
    <style>
        .fit-to-screen {
            max-width: 100vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .original-size {
            /* no constraints — natural image size */
        }
        iframe.fit-to-screen {
            width: 100%;
            height: 90vh;
        }
        iframe.original-size {
            width: 100%;
        }
        /*
         * Touch devices (phones, tablets) — make tap targets finger-sized.
         * `pointer: coarse` is the modern way to ask "is the primary input
         * a fingertip?", and it works regardless of layout viewport width.
         * We keep the desktop-style 980px layout so slide content still
         * scales down to fit — only the buttons are scaled up.
         *
         * Sizes are deliberately large in CSS px: iOS shrinks the 980px
         * layout to fit the ~393px physical screen (~2.5x), so a 60px
         * font-size in CSS ends up at ~24px on the glass.
         */
        @media (pointer: coarse) {
            button {
                font-size: 40px;
                padding: 20px 28px;
                margin: 4px;
            }
        }
    </style>
</head>
<body>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="slides.js"></script>
<div id="app">
    <div style="display:flex;justify-content: space-between;;position:sticky;top:0;background-color:white;">
        <div>
            <button @click="fitToScreen = !fitToScreen">{{ fitToScreen ? 'Original size' : 'Fit to screen' }}</button>
            <button @click="previousImage" :disabled="currentImage === 0">Previous</button>
            <button @click="nextImage" :disabled="currentImage === images.length - 1">Next</button>
            {{ currentImage + 1 }} of {{ images.length}}
        </div>
        <div>
            <button @click="firstImage">|&lt;</button>
            <button @click="lastImage">&gt;|</button>
        </div>
    </div>
    <div style="width:100%;overflow:scroll">
        <div v-if="images[currentImage].substring(0,1)!=='@'">
            <img :alt="images[currentImage].split('/').pop().split('.')[0]" :class="fitToScreen ? 'fit-to-screen' : 'original-size'" :src="images[currentImage]"><br/>
        </div>
        <div v-else>
            <iframe :class="fitToScreen ? 'fit-to-screen' : 'original-size'" :src="images[currentImage].substring(1)" height="90%">Page not found</iframe>
        </div>
    </div>
</div>
<script>
    const {createApp, ref} = Vue;

    createApp({
        setup() {
            const images = window.SLIDES;
            const fitToScreen = ref(true);
            const search = Number(location.search.substring(1));
            function setSearch() {
                if (currentImage.value) {
                    location.search = currentImage.value + 1;
                } else {
                    location.search = '';
                }
            }
            const currentImage = ref(search ? search -1 : search);
            function firstImage() {
                currentImage.value = 0;
                setSearch();
            }
            function previousImage() {
                currentImage.value -= 1;
                setSearch();
            }
            function nextImage() {
                currentImage.value += 1;
                setSearch();
            }
            function lastImage() {
                currentImage.value = images.length - 1;
                setSearch();
            }
            return {
                images,
                currentImage,
                fitToScreen,
                firstImage,
                previousImage,
                nextImage,
                lastImage,
            }
        }
    }).mount("#app");
</script>
</body>
</html>
